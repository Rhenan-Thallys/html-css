<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
    <script src="https://kit.fontawesome.com/c091e830b3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <header>
        <div class="container">

            <i class="fa-solid fa-bars"></i>

            <div class="direita">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-bell"></i>
            </div>

        </div>
    </header>

    <main>
        <h1>Olá, "Seu nome"</h1>
        <p>Organize seus planos para o dia</p>

        <section id="
        categorias">

        <div id="categoriasitens">
            <div class="item">
                <img src="imagens/school.png" alt="">
                <p>Escola</p>
            </div>
            <div class="item">
                <img src="imagens/target.png" alt="">
                <p>Design</p>
            </div>
            <div class="item">
                <img src="imagens/basketball.png" alt="">
                <p>Esporte</p>
            </div>
            <div class="item">
                <img src="imagens/briefcase.png" alt="">
                <p>Financeiro</p>
            </div>
        </div>

        <h2>Tarefas de hoje</h2>

        <section id="tarefas">
            <div class="tarefasitem">
                <p>Trabalhar nos projetos dos clientes</p>
                <p>8am - 9am</p>
            </div>
            <br>
            <div class="tarefasitem">
                <p>Sala 3D</p>
                <p>12pm - 1pm</p>
            </div>
            <br>
            <div class="tarefasitem">
                <p>Oração</p>
                <p>8am - 9am</p>
            </div>
        </section>

        </section>

        <a href="createtask.html" target="_self"><button id="newtask">+ Adicionar nova tarefa</button></a>

    </main>

</body>
</html>
