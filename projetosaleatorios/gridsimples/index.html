<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Simples</title>
    <style>
        header {
            background-color: black;
            color: white;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
        }

        .container {
            margin-top: 10px;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto;
            height: 350px;
        }

        .item {
            height: 150px;
            border: 2px solid red;
        }

        .item img {
            display: grid;
            width: 100%;
            height: 100%;
            object-fit: fill;
        }
    </style>
</head>
<body>
    <header>
        <h1>Grid Simples</h1>
        <p>Um grid com HTML e CSS puro</p>
    </header>
    <div class="container">
        <div class="item">
            <img src="photo-1506744038136-46273834b3fb.jpg" alt="">
            <h1>Montanhas</h1>
            <p>A beleza das grandes alturas.</p>
        </div>
        <div class="item">
            <h1>Praia</h1>
            <p>Sol, mar e tranquilidade.</p>
        </div>
        <div class="item">
            <h1>Floresta</h1>
            <p>Conecte-se com a natureza.</p>
        </div>
        <div class="item">
            <h1>Cachoeira</h1>
            <p>A força e a beleza da água.</p>
        </div>
        <div class="item">
            <h1>Estrada</h1>
            <p>Novos caminhos te esperam.</p>
        </div>
        <div class="item">
            <h1>Cidade</h1>
            <p>A vida nunca para.</p>
        </div>
    </div>
</body>
</html>
