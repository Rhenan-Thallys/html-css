<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Grid</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            background: border-box;
            display: grid;
            grid-template-rows: auto auto auto auto;
            grid-template-columns: auto auto;
            border: 1px solid black;
            height: 400px;
            gap: 1px;
        }

        .topo {
            background-color: yellow;
            border: 1px solid red;
            justify-content: center;
            align-content: center;
            align-items: center;
            display: grid;
            grid-area: 1 / 1 / 2 / -1;
        }

        .menu {
            background-color: yellow;
            border: 1px solid red;
            justify-content: center;
            align-content: center;
            align-items: center;
            display: grid;
            grid-area: 2 / 1 / 3 / -1;
        }

        .principal {
            background-color: yellow;
            border: 1px solid red;
            justify-content: left;
            align-content: center;
            padding-left: 15px;
            display: grid;
            grid-area: 3 / 1 / -2 / -2;
        }

        .secundario {
            background-color: yellow;
            border: 1px solid red;
            justify-content: left;
            align-content: center;
            padding-left: 15px;
            display: grid;
            grid-area: 3 / -2 / -2 / -1;
        }

        .rodape {
            background-color: yellow;
            border: 1px solid red;
            justify-content: center;
            align-content: center;
            align-items: center;
            display: grid;
            grid-area: -2 / -1 / -1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topo">topo</div>
        <div class="menu">menu</div>
        <div class="principal">principal</div>
        <div class="secundario">secundario</div>
        <div class="rodape">rodape</div>
    </div>
</body>
</html>
