<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordak</title>
    <style>

        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            background-image: url(imagens/photo-1704482622067-f728f2d83265.avif);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }

        nav {
            display: flex;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            margin-top: 15px;
        }

        nav ul {
            list-style-type: none;
            display: flex;
            justify-content: space-between;
            gap: 130px;
        }

        nav ul li:hover {
            background: black;
            transform: translateX(5px);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Main menu</li>
                <li>Log-in</li>
                <li>Sign-up</li>
            </ul>
        </nav>
    </header>
</body>
</html>
